project:
  name: robust-ai-image-detector
  seed: 42
paths:
  resources_dir: resources
  outputs_dir: model/outputs
  hf_cache_dir: .cache/huggingface
model:
  model_id: openai/clip-vit-large-patch14
  revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
  embedding_dim: 768
image_limits:
  max_upload_bytes: 10485760
  max_pixels: 40000000
datasets:
  sid:
    dataset_id: saberzl/SID_Set
    revision: dc03ead57929879319ce30a82bfcfb8d317b10bd
  cifake:
    dataset_id: birdy654/cifake-real-and-ai-generated-synthetic-images
training:
  linear_learning_rate: 0.001
  mlp_learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 100
  early_stopping_patience: 10
  clean_batch_size: 1024
  grouped_sources_per_batch: 341
  consistency_lambda: 1.0
